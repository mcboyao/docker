services:
  redis:
    image: redis:7.4.2-alpine3.21
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    networks:
      - redis_network

volumes:
  redis:
    driver: local

networks:
  redis_network:
    driver: bridge